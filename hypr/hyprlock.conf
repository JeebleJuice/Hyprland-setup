source = ~/.config/hypr/colors-wallust.conf

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = ~/.cache/hyprlock/current_lock_wallpaper.jpg
    blur_passes = 4
    blur_size = 9
    noise = 0.02
    contrast = 1.08
    brightness = 0.38
    vibrancy = 0.18
    vibrancy_darkness = 0.25
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $foreground
    font_size = 72
    font_family = Noto Sans
    position = 0, 115
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $color2
    font_size = 18
    font_family = Noto Sans
    position = 0, 50
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] basename "$(readlink -f ~/.cache/hyprlock/current_wallpaper 2>/dev/null || cat ~/.cache/current_wall_state 2>/dev/null)" | sed 's/\.[^.]*$//'
    color = $color4
    font_size = 14
    font_family = Noto Sans
    position = 0, 18
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 58
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.28
    dots_center = true
    outer_color = $color4
    inner_color = rgba(00000055)
    font_color = $foreground
    fade_on_empty = false
    placeholder_text = <span foreground="##B7B2B9">Password</span>
    fail_text = <span foreground="##CDA9C8">Wrong password</span>
    check_color = $color3
    fail_color = $color5
    rounding = 16
    position = 0, -55
    halign = center
    valign = center
}

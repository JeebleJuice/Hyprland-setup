# Start Polkit
exec-once = /usr/libexec/kf6/polkit-kde-authentication-agent-1

# Load Notification Daemon
exec-once = swaync

# Load GTK settings
exec-once = ~/.config/hypr/scripts/gtk.sh

# Using hypridle to start hyprlock
exec-once = hypridle

# Load cliphist history
exec-once = wl-paste --watch cliphist store

# Start optional desktop extras when installed
exec-once = ~/.config/hypr/scripts/start_hyprsunset.sh
exec-once = ~/.config/hypr/scripts/start_pyprland.sh

# Load wallpaper
exec-once = ~/.config/hypr/scripts/restore_wallpaper.sh

exec-once = hyprpm reload -n

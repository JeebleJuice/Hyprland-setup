plugin {
    hyprexpo {
        columns =  2
        gap_size = 3
        bg_col = rgba(f0f0f0cc)
        enable_gesture = true
	gesture_distance = 200        
        #gesture_positive = true
    }
    hyprfocus {
        enabled = yes
	    
        keyboard_focus_animation = shrink
        mouse_focus_animation = flash

        bezier = bezIn, 0.05, 0.7, 0.1, 1.0
        bezier = bezOut, 0.3, 0.0, 0.8, 0.15

        flash {
            flash_opacity = 0.35

            in_bezier = bezIn
            in_speed = 4

            out_bezier = bezOut
            out_speed = 3
        }

        shrink {
            shrink_percentage = 0.96

            in_bezier = bezIn
            in_speed = 4

            out_bezier = bezOut
            out_speed = 3
        }
    }
}   

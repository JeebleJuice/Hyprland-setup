windowrule = match:class satty, float on, center on, animation fade
windowrule = match:class Rofi, float on, animation fade
windowrule = match:class nautilus --new-window, float on, animation fade
windowrule = match:class org.gnome.Calculator, float on, center on
windowrule = match:class firefox-developer-edition, match:title Picture-in-Picture, float on, pin on
windowrule = match:class nvim, border_size 0
windowrule = match:class kwrite, opacity 0.97 0.92
windowrule = match:class org.kde.kwrite, opacity 0.97 0.92
windowrule = match:class kmail, opacity 0.97 0.92
windowrule = match:class org.kde.kmail2, opacity 0.97 0.92

windowrule {
    name = vscode-max
    match:initial_class = ^(Code|code-url-handler)$
    
    maximize = 2
}

# Don't Starve Together drops its XWayland fullscreen request when it loses
# focus. Keep fullscreen under Hyprland's control so only Super+F toggles it.
windowrule {
    name = dontstarve-manual-fullscreen
    match:class = ^dontstarve_steam_x64$

    fullscreen = on
    suppress_event = fullscreen
}

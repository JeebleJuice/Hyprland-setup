# -----------------------------------------------------
# Monitor
# -----------------------------------------------------
source = ~/.config/hypr/conf/monitors/auto.conf

# -----------------------------------------------------
# Cursor
# -----------------------------------------------------
source = ~/.config/hypr/conf/cursors/cursor.conf

# -----------------------------------------------------
# Environment
# -----------------------------------------------------
source = ~/.config/hypr/conf/environments/default.conf

# -----------------------------------------------------
# Keyboard
# -----------------------------------------------------
source = ~/.config/hypr/conf/keyboards/keyboard.conf

# -----------------------------------------------------
# Load color file
# -----------------------------------------------------
source = ~/.config/hypr/colors-wallust.conf

# -----------------------------------------------------
# Autostarta
# -----------------------------------------------------
source = ~/.config/hypr/conf/autostart.conf

# -----------------------------------------------------
# Load configuration files
# -----------------------------------------------------
source = ~/.config/hypr/conf/windows/glass.conf
source = ~/.config/hypr/conf/decorations/blur.conf
source = ~/.config/hypr/conf/layouts/default.conf
source = ~/.config/hypr/conf/workspaces/default.conf
source = ~/.config/hypr/conf/miscs/misc.conf
source = ~/.config/hypr/conf/keybindings/default.conf
source = ~/.config/hypr/conf/windowrules/default.conf
# Plugin config is disabled until hyprpm plugins build cleanly on this
# Hyprland/GCC stack.
# source = ~/.config/hypr/conf/plugins/default.conf

# -----------------------------------------------------
# Animation
# -----------------------------------------------------
source = ~/.config/hypr/conf/animations/default.conf

# -----------------------------------------------------
# Environment for xdg-desktop-portal-hyprland
# -----------------------------------------------------
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

#------------------------------------------------------
# Waybar
#------------------------------------------------------
exec-once = waybar


xwayland {
    force_zero_scaling = true
}

device {
    name = asuf1204:00-2808:0202-touchpad
    enabled = false
}
